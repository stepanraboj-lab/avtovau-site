name: Publish AutoVau website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Проверить архив и загрузить артефакт без публикации"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.ARTIFACT_NAME }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Extract and validate the website ZIP
        run: |
          unzip -tq site.zip
          mkdir -p public
          unzip -oq site.zip -d public

          for path in \
            index.html \
            cars/kia-rio/index.html \
            cars/peugeot-308-sw/index.html \
            cars/renault-logan/index.html \
            cars/vw-polo-2013/index.html \
            CNAME \
            assets/IMG_7593.jpeg \
            assets/IMG_7595.jpeg \
            assets/IMG_7597.jpeg \
            assets/IMG_7598.jpeg \
            assets/IMG_7600.jpeg \
            assets/kia-01.jpg \
            assets/kia-02.jpg \
            assets/kia-03.jpg \
            assets/kia-04.jpg \
            assets/kia-05.jpg \
            assets/kia-06.jpg \
            assets/kia-07.jpg \
            assets/kia-08.jpg \
            assets/logan-01-front.jpg \
            assets/logan-02-left-side.jpg \
            assets/logan-03-right-side.jpg \
            assets/logan-04-rear.jpg \
            assets/logan-05-rear-seats.jpg \
            assets/logan-06-dashboard.jpg \
            assets/logan-07-trunk.jpg \
            assets/polo-01-front.jpg \
            assets/polo-02-side.jpg \
            assets/polo-03-rear.jpg \
            assets/polo-04-interior.jpg \
            assets/polo-05-trunk.jpg \
            assets/polo-06-dashboard.jpg \
            assets/polo-07-rear-seats.jpg; do
            if [[ ! -f "public/$path" || ! -s "public/$path" ]]; then
              echo "::error file=site.zip::Missing or empty required file: $path"
              exit 1
            fi
          done

          if [[ ! -f public/.nojekyll ]]; then
            echo "::error file=site.zip::Missing required file: .nojekyll"
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: public
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !inputs.diagnostics_only
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded artifact to appear in Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          if [[ -z "$ARTIFACT_NAME" || ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The build did not return an artifact name and ID."
            exit 1
          fi

          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME"
          for attempt in {1..7}; do
            if timeout 10s gh api "$endpoint" |
              jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" \
                'any(.artifacts[]; .name == $name and (.id | tostring) == $id and .expired == false)' >/dev/null; then
              echo "Artifact $ARTIFACT_NAME (ID $ARTIFACT_ID) is visible in run $GITHUB_RUN_ID."
              exit 0
            fi
            echo "Artifact $ARTIFACT_NAME (ID $ARTIFACT_ID) not confirmed in run $GITHUB_RUN_ID ($attempt/7)."
            if [[ "$attempt" -lt 7 ]]; then sleep 5; fi
          done

          echo "::error::The artifact uploaded by build was not visible in the Actions API for this run."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
