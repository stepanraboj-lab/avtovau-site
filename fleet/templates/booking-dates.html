<div id="booking-dates" hidden>
  <p class="booking-state">$status</p>
  <div class="booking-date-grid">
    <label>Дата начала <input type="date" id="booking-start" aria-describedby="booking-quote"></label>
    <label>Дата окончания <input type="date" id="booking-end" aria-describedby="booking-quote"></label>
  </div>
  <p id="booking-quote" aria-live="polite"></p>
  <p class="booking-dialog__description">Можно написать без дат или запросить будущие даты для занятой машины. Доступность и итоговую стоимость подтверждает владелец.</p>
</div>
