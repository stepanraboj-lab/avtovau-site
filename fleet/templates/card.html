<a class="catalog-card" href="$path">
  <div class="catalog-photo">$photo$status</div>
  <div class="catalog-card__body">
    <h3>$name</h3>
    $features
    <div class="catalog-card__price">
      <p class="catalog-price">от $monthly&nbsp;₽ / сутки</p>
      <p class="payment-note">При оплате за месяц</p>
      <span class="details-button"><span>Подробнее</span>$arrow</span>
    </div>
  </div>
</a>
